name: Client Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # The full chain runs a fail-closed production build, which rejects a localhost
      # origin, while the e2e Playwright webServer rebuilds against the local backend
      # with its own `--allow-local`. So the build-time origin must be non-local while
      # the contract and e2e targets stay on localhost.
      NEXT_PUBLIC_SAJURIUM_API_URL: https://api.sajurium.example
      SAJURIUM_BACKEND_OPENAPI_URL: http://localhost:8000/api/v1/openapi.json
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `api:check:backend` and the e2e suite both need a live FastAPI, which lives in a
      # private repository. This repository is public, so the credential is optional and
      # the backend-dependent half of the chain is reported rather than failed when it
      # is absent. Configure `SAJURIUM_BACKEND_TOKEN` with read access to run it here;
      # otherwise run `bun run test:quality` locally against the backend.
      - name: Detect the backend credential
        id: backend
        env:
          TOKEN: ${{ secrets.SAJURIUM_BACKEND_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=Backend contract and e2e skipped::SAJURIUM_BACKEND_TOKEN is not configured, so api:check:backend and the 96 e2e tests did not run in this job. Run 'bun run test:quality' with the backend up to cover them."
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gates that need no backend
        if: steps.backend.outputs.available != 'true'
        run: |
          bun run api:check
          bun run lint
          bun run typecheck
          bun run test:unit
          bun run build

      - if: steps.backend.outputs.available == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out the backend contract
        if: steps.backend.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: bread-dispenser/sasaju
          token: ${{ secrets.SAJURIUM_BACKEND_TOKEN }}
          path: backend

      - name: Install the backend
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      # The server and the chain share one step: GitHub does not guarantee that a
      # background process outlives the step that started it.
      - name: Full quality chain against a live backend
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        env:
          # A CI-only secret: this instance is disposable and never reaches production.
          SECRET_KEY: ci-quality-gate-secret-not-used-in-production
          CORS_ALLOWED_ORIGINS: http://localhost:3100
          DATABASE_URL: sqlite:////tmp/ci-quality.db
        run: |
          nohup .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8000/health >/dev/null; then
            echo "backend did not become ready" >&2
            cat /tmp/backend.log >&2
            exit 1
          fi
          cd ..
          bunx playwright install --with-deps chromium
          bun run test:quality

  deploy:
    if: github.event_name != 'pull_request' && vars.VERCEL_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SAJURIUM_API_URL: ${{ vars.SAJURIUM_API_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Deploy public prototype
        run: bunx vercel@54.18.1 deploy --prod --yes --build-env NEXT_PUBLIC_SAJURIUM_API_URL="$NEXT_PUBLIC_SAJURIUM_API_URL" --token="$VERCEL_TOKEN"
      - name: Smoke public production alias
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PRODUCTION_URL" | grep --quiet "사주리움"
