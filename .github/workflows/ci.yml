name: Client Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # The full chain runs a fail-closed production build, which rejects a localhost
      # origin, while the e2e Playwright webServer rebuilds against the local backend
      # with its own `--allow-local`. So the build-time origin must be non-local while
      # the contract and e2e targets stay on localhost.
      NEXT_PUBLIC_SAJURIUM_API_URL: https://api.sajurium.example
      SAJURIUM_BACKEND_OPENAPI_URL: http://localhost:8000/api/v1/openapi.json
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The backend is private. A separate read-only token enables the full chain;
      # without it, the public client checks still gate deployment.
      - name: Detect the backend credential
        id: backend
        env:
          TOKEN: ${{ secrets.SAJURIUM_BACKEND_TOKEN }}
          REPOSITORY: ${{ vars.SAJURIUM_BACKEND_REPOSITORY }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$REPOSITORY" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=Backend contract and e2e skipped::A backend read token is not configured; run the full chain locally against an isolated backend."
          fi

      - name: Quality gates that need no backend
        if: steps.backend.outputs.available != 'true'
        run: |
          bun run api:check
          bun run lint
          bun run typecheck
          bun run test:unit
          bun run build

      - if: steps.backend.outputs.available == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out the backend contract
        if: steps.backend.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.SAJURIUM_BACKEND_REPOSITORY }}
          token: ${{ secrets.SAJURIUM_BACKEND_TOKEN }}
          path: backend

      - name: Install the backend
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      # The server and the chain share one step: GitHub does not guarantee that a
      # background process outlives the step that started it.
      - name: Full quality chain against a live backend
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        env:
          # A CI-only secret: this instance is disposable and never reaches production.
          SECRET_KEY: ci-quality-gate-secret-not-used-in-production
          CORS_ALLOWED_ORIGINS: http://localhost:3100
          DATABASE_URL: sqlite:////tmp/ci-quality.db
        run: |
          nohup .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl --fail --silent http://localhost:8000/health >/dev/null; then
            echo "backend did not become ready" >&2
            cat /tmp/backend.log >&2
            exit 1
          fi
          cd ..
          bunx playwright install --with-deps chromium
          bun run test:quality
