name: Client Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SAJURIUM_API_URL: ${{ vars.SAJURIUM_API_URL }}
      SAJURIUM_BACKEND_OPENAPI_URL: ${{ vars.SAJURIUM_API_URL }}/api/v1/openapi.json
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:quality

  deploy:
    if: github.event_name != 'pull_request' && vars.VERCEL_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SAJURIUM_API_URL: ${{ vars.SAJURIUM_API_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Deploy public prototype
        run: bunx vercel@54.18.1 deploy --prod --yes --build-env NEXT_PUBLIC_SAJURIUM_API_URL="$NEXT_PUBLIC_SAJURIUM_API_URL" --token="$VERCEL_TOKEN"
      - name: Smoke public production alias
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PRODUCTION_URL" | grep --quiet "사주리움"
